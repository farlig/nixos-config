name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Drives flake-update-preview only. Scheduled runs happen on the default
  # branch, and cron is UTC with no DST handling.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# The newest run on a ref wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate: does the committed flake.lock still evaluate for every host?
  eval:
    name: eval all hosts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          # The flake has nine `github:` inputs and runner IPs are shared, so
          # unauthenticated fetches hit GitHub's 60/hour API limit and fail with
          # a 403. GITHUB_TOKEN is injected by Actions; nothing to configure.
          nix_conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate every host
        run: .github/scripts/eval-hosts.sh

  # Answers a question the gate above cannot: is `flupdate` safe this week?
  # The lock is bumped in the runner's checkout only and thrown away with it, so
  # a failure here means today's inputs break a host — not that main is broken.
  flake-update-preview:
    name: flake update preview
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update the lock
        run: nix flake update

      - name: Report what moved
        run: git --no-pager diff --stat flake.lock

      - name: Evaluate every host against the new lock
        run: .github/scripts/eval-hosts.sh
